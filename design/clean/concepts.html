<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Melodyn – clean 2D concepts</title>
<link rel="stylesheet" href="../../app/fonts/fonts.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #d9d6d0; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 40px; }
.concept { display: flex; gap: 28px; padding: 36px 36px 40px; background: #e9e6e0; border-radius: 28px; margin-bottom: 40px; width: max-content; flex-direction: column; }
.concept > header { display: flex; align-items: baseline; gap: 16px; color: #111; }
.concept > header b { font-size: 34px; letter-spacing: -.03em; font-weight: 650; }
.concept > header span { font-size: 17px; color: #555; }
.row { display: flex; gap: 28px; }
.ph { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 30px 60px -30px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.sb { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-size: 15px; font-weight: 600; }
.sb i { width: 64px; height: 20px; border-radius: 99px; background: currentColor; opacity: .9; }
.pad { padding: 0 24px; }
svg { display: block; }
.ico { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab { margin-top: auto; display: flex; justify-content: space-around; padding: 10px 0 30px; font-size: 11px; }
.tab div { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: .45; }
.tab div.on { opacity: 1; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
.li b { display: block; font-size: 16px; font-weight: 580; }
.li span { font-size: 13px; opacity: .6; }
.li .d { margin-left: auto; font-size: 13px; opacity: .5; font-family: 'Geist Mono'; }

/* ============ A · Linie ============ */
.A { background: #0c0c0d; color: #f4f2ee; }
.A .greet { font-size: 15px; color: #8b8984; margin-top: 18px; }
.A h1 { font-size: 38px; font-weight: 600; letter-spacing: -.035em; line-height: 1.05; margin-top: 6px; }
.A .hero { margin: 30px auto 0; }
.A .cta { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 26px; font-size: 15px; }
.A .cta .btn { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid #f4f2ee; display: grid; place-items: center; }
.A .h2 { font-size: 13px; color: #8b8984; letter-spacing: .02em; margin: 36px 0 12px; }
.A .chips { display: flex; gap: 8px; flex-wrap: wrap; }
.A .chip { border: 1px solid #2c2b29; border-radius: 99px; padding: 9px 14px; font-size: 14px; }
.A .chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.A .said { font-size: 30px; font-weight: 560; letter-spacing: -.025em; line-height: 1.15; margin-top: 30px; }

.A .kv { margin-top: 26px; border-top: 1px solid #222; }

.A .kv span { color: #8b8984; }
.A .cover { width: 342px; height: 342px; margin: 18px auto 0; border-radius: 6px; background: #151516; }
.A .meta { margin-top: 26px; display: flex; justify-content: space-between; align-items: flex-end; }

.A .meta p { color: #8b8984; font-size: 15px; margin-top: 4px; }
.A .prog { margin-top: 22px; height: 1px; background: #2c2b29; position: relative; }
.A .prog i { position: absolute; left: 0; top: -1px; height: 3px; width: 34%; background: #f4f2ee; }
.A .times { display: flex; justify-content: space-between; font: 12px 'Geist Mono'; color: #77756f; margin-top: 8px; }
.A .ctrl { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding: 0 6px; }
.A .play { width: 70px; height: 70px; border-radius: 50%; background: #f4f2ee; color: #0c0c0d; display: grid; place-items: center; }
.A .next { margin-top: 18px; font-size: 13px; color: #8b8984; display: flex; gap: 8px; align-items: center; }
.A .steer { margin: auto 16px 34px; border: 1px solid #2c2b29; border-radius: 99px; height: 54px; display: flex; align-items: center; padding: 0 8px 0 20px; color: #77756f; font-size: 15px; justify-content: space-between; }
.A .steer b { width: 40px; height: 40px; border-radius: 50%; background: #f4f2ee; color: #0c0c0d; display: grid; place-items: center; }
.A .tab { border-top: 1px solid #1d1d1c; }

/* ============ B · Papier ============ */
.B { background: #f2eee5; color: #161513; }

.B h1 { font-family: 'Instrument Serif'; font-weight: 400; font-size: 52px; letter-spacing: -.02em; line-height: .95; margin-top: 6px; }

.B .card { width: 132px; }
.B .card b { display: block; font-size: 14.5px; font-weight: 580; margin-top: 8px; }
.B .card span { font-size: 12.5px; color: #77736a; }
.B .said { font-family: 'Instrument Serif'; font-size: 40px; line-height: 1.05; margin-top: 28px; }

.B .kv { margin-top: 24px; }

.B .kv span { color: #77736a; }
.B .cover { width: 342px; height: 342px; margin: 18px auto 0; border-radius: 4px; }
.B .meta { margin-top: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
.B .meta h2 { font-family: 'Instrument Serif'; font-weight: 400; font-size: 36px; line-height: 1; }
.B .meta p { color: #77736a; font-size: 15px; margin-top: 6px; }
.B .prog { margin-top: 22px; height: 2px; background: #d9d3c6; position: relative; }
.B .prog i { position: absolute; inset: 0 66% 0 0; background: #161513; }
.B .times { display: flex; justify-content: space-between; font: 12px 'Geist Mono'; color: #8d887d; margin-top: 8px; }
.B .ctrl { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding: 0 6px; }
.B .play { width: 72px; height: 72px; border-radius: 50%; background: #161513; color: #f2eee5; display: grid; place-items: center; }
.B .next { margin-top: 18px; font-size: 13px; color: #77736a; }
.B .steer { margin: auto 16px 34px; background: #e7e1d4; border-radius: 99px; height: 54px; display: flex; align-items: center; padding: 0 8px 0 20px; color: #8d887d; font-size: 15px; justify-content: space-between; }
.B .steer b { width: 40px; height: 40px; border-radius: 50%; background: #161513; color: #f2eee5; display: grid; place-items: center; }
.B .tab { border-top: 1px solid #ddd6c8; }

/* ============ C · Raster ============ */
.C { background: #121212; color: #efefef; font-family: 'Geist'; }
.C .mono { font-family: 'Geist Mono'; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: #7a7a7a; }
.C h1 { font-size: 44px; font-weight: 700; letter-spacing: -.045em; line-height: .98; margin-top: 10px; }
.C .hero { margin: 24px 24px 0; border-radius: 0; }
.C .cta { display: flex; justify-content: space-between; align-items: center; margin: 14px 24px 0; }
.C .cta .btn { height: 52px; padding: 0 22px; border-radius: 99px; background: #d7ff3c; color: #121212; display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; }
.C .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
.C .tile { aspect-ratio: 1; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; color: #121212; }
.C .tile b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.C .said { font-size: 34px; font-weight: 650; letter-spacing: -.035em; line-height: 1.05; margin-top: 26px; }
.C .said em { font-style: normal; color: #4a4a4a; }
.C .kv { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #2a2a2a; border: 1px solid #2a2a2a; }
.C .kv div { background: #121212; padding: 12px; }
.C .kv span { display: block; font: 10.5px 'Geist Mono'; text-transform: uppercase; letter-spacing: .06em; color: #7a7a7a; margin-bottom: 6px; }
.C .kv b { font-size: 16px; font-weight: 600; }
.C .cover { width: 342px; height: 342px; margin: 16px auto 0; }
.C .meta { margin-top: 20px; }
.C .meta h2 { font-size: 30px; font-weight: 700; letter-spacing: -.035em; }
.C .meta p { margin-top: 6px; }
.C .prog { margin-top: 20px; display: flex; gap: 2px; }
.C .prog i { flex: 1; height: 14px; background: #2a2a2a; }
.C .prog i.on { background: #efefef; }
.C .times { display: flex; justify-content: space-between; margin-top: 8px; }
.C .ctrl { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.C .play { width: 76px; height: 52px; border-radius: 99px; background: #d7ff3c; color: #121212; display: grid; place-items: center; }
.C .steer { margin: auto 16px 34px; background: #1e1e1e; border-radius: 99px; height: 54px; display: flex; align-items: center; padding: 0 8px 0 20px; color: #7a7a7a; font-size: 15px; justify-content: space-between; }
.C .steer b { width: 40px; height: 40px; border-radius: 50%; background: #d7ff3c; color: #121212; display: grid; place-items: center; }

/* ============ D · Weich ============ */
.D { background: #f4f1fb; color: #1d1838; }
.D .greet { font-size: 15px; color: #7e78a0; margin-top: 18px; }
.D h1 { font-size: 36px; font-weight: 650; letter-spacing: -.03em; line-height: 1.05; margin-top: 6px; }
.D .hero { margin: 26px auto 0; }
.D .cta { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; font-size: 15px; font-weight: 560; }
.D .cta small { color: #7e78a0; font-weight: 450; font-size: 13px; }
.D .h2 { font-size: 17px; font-weight: 650; margin: 30px 0 12px; }
.D .cards { display: flex; gap: 12px; }
.D .card { width: 140px; padding: 12px; border-radius: 24px; background: #fff; box-shadow: 0 1px 0 rgba(29,24,56,.06); }
.D .card b { display: block; font-size: 14px; font-weight: 620; margin-top: 10px; }
.D .card span { font-size: 12px; color: #7e78a0; }
.D .said { font-size: 30px; font-weight: 640; letter-spacing: -.025em; line-height: 1.15; margin-top: 28px; }
.D .said em { font-style: normal; color: #b9b3d6; }
.D .kv { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
.D .kv div { background: #fff; border-radius: 99px; padding: 9px 14px; font-size: 14px; }
.D .kv span { color: #7e78a0; margin-right: 6px; }
.D .cover { width: 342px; height: 342px; margin: 16px auto 0; border-radius: 36px; }
.D .meta { margin-top: 22px; display: flex; justify-content: space-between; align-items: flex-end; }
.D .meta h2 { font-size: 27px; font-weight: 680; letter-spacing: -.03em; }
.D .meta p { color: #7e78a0; font-size: 15px; margin-top: 4px; }
.D .prog { margin-top: 22px; height: 8px; border-radius: 99px; background: #e2ddf3; position: relative; }
.D .prog i { position: absolute; inset: 0 66% 0 0; border-radius: 99px; background: #6c56f0; }
.D .times { display: flex; justify-content: space-between; font-size: 12px; color: #7e78a0; margin-top: 8px; }
.D .ctrl { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 0 6px; }
.D .play { width: 74px; height: 74px; border-radius: 26px; background: #6c56f0; color: #fff; display: grid; place-items: center; }
.D .steer { margin: auto 16px 34px; background: #fff; border-radius: 22px; height: 56px; display: flex; align-items: center; padding: 0 8px 0 18px; color: #9a94bb; font-size: 15px; justify-content: space-between; }
.D .steer b { width: 42px; height: 42px; border-radius: 15px; background: #6c56f0; color: #fff; display: grid; place-items: center; }
.D .tab { background: #fff; border-radius: 26px 26px 0 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Deterministic random
function rng(seed) { let a = 0; for (const ch of String(seed)) a = Math.imul(a ^ ch.charCodeAt(0), 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const I = {
  mic: '<rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
  pause: '<rect x="7" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.4" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/>',
  next: '<path d="M5 6v12l9-6z"/><path d="M18 6v12"/>',
  prev: '<path d="M19 6v12l-9-6z"/><path d="M6 6v12"/>',
  up: '<path d="M7 11v9H4.5V11H7zm0 0l4-7.5a2 2 0 0 1 3.2 1.6V9h4.6a2 2 0 0 1 2 2.4l-1.4 6.8A2 2 0 0 1 17.4 20H7"/>',
  down: '<g transform="rotate(180 12 12)"><path d="M7 11v9H4.5V11H7zm0 0l4-7.5a2 2 0 0 1 3.2 1.6V9h4.6a2 2 0 0 1 2 2.4l-1.4 6.8A2 2 0 0 1 17.4 20H7"/></g>',
  add: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  listen: '<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',
  lib: '<rect x="4" y="8" width="12" height="12" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v10"/>',
  user: '<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  chev: '<path d="M6 9.5l6 6 6-6"/>',
  more: '<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1.6" fill="currentColor" stroke="none"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
};
const ic = (n, s = 26, extra = '') => `<svg class="ico" viewBox="0 0 24 24" style="width:${s}px;height:${s}px" ${extra}>${I[n]}</svg>`;
const sb = (t = '9:41') => `<div class="sb"><span>${t}</span><i style="opacity:0"></i><span>●●● ▮</span></div>`;
const tabs = (on, cls = '') => `<div class="tab ${cls}">${[['listen', 'Hören'], ['lib', 'Bibliothek'], ['user', 'Dein Sound']].map(([i, l], k) => `<div class="${k === on ? 'on' : ''}">${ic(i, 24)}${l}</div>`).join('')}</div>`;

// ---------- generative 2D artwork ----------
// contour rings as flat lines (A)
function contour(size, seed, { stroke = '#f4f2ee', accent = '#ff6a3d', n = 16, bg = 'none', sw = 1 } = {}) {
  const r = rng(seed), cx = size * (0.42 + r() * 0.16), cy = size * (0.42 + r() * 0.16), f1 = 3 + Math.floor(r() * 2), f2 = 5 + Math.floor(r() * 3), p1 = r() * 6, p2 = r() * 6;
  let out = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${bg !== 'none' ? `<rect width="${size}" height="${size}" fill="${bg}"/>` : ''}`;
  for (let i = 0; i < n; i++) {
    const base = size * 0.62 * Math.pow((i + 1) / (n + 1), 1.08), amp = base * 0.075;
    let d = '';
    for (let k = 0; k <= 120; k++) { const a = k / 120 * Math.PI * 2, rr = base + amp * Math.sin(a * f1 + p1 + i * .3) + amp * .5 * Math.sin(a * f2 + p2 - i * .2); d += (k ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1); }
    const hi = i === Math.floor(n * 0.45);
    out += `<path d="${d}Z" fill="none" stroke="${hi ? accent : stroke}" stroke-width="${hi ? sw * 2 : sw}" opacity="${hi ? 1 : (0.25 + 0.6 * (1 - i / n)).toFixed(2)}"/>`;
  }
  return out + '</svg>';
}
// Bauhaus composition (B)
function bauhaus(size, seed, pal) {
  const r = rng(seed), u = size / 4;
  let o = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="${pal[0]}"/>`;
  const cells = [];
  for (let y = 0; y < 4; y += 2) for (let x = 0; x < 4; x += 2) cells.push([x, y]);
  cells.forEach(([x, y], i) => {
    const c = pal[1 + (i + Math.floor(r() * 3)) % (pal.length - 1)], X = x * u, Y = y * u, S = 2 * u, k = Math.floor(r() * 5);
    if (k === 0) o += `<circle cx="${X + u}" cy="${Y + u}" r="${u}" fill="${c}"/>`;
    else if (k === 1) o += `<path d="M${X} ${Y + S} A${u} ${u} 0 0 1 ${X + S} ${Y + S}Z" fill="${c}"/><path d="M${X} ${Y + u} A${u} ${u} 0 0 1 ${X + S} ${Y + u}" fill="none" stroke="${pal[pal.length - 1]}" stroke-width="${u * .12}"/>`;
    else if (k === 2) o += `<path d="M${X} ${Y} L${X + S} ${Y} L${X} ${Y + S}Z" fill="${c}"/>`;
    else if (k === 3) o += `<rect x="${X}" y="${Y + u * .5}" width="${S}" height="${u}" fill="${c}"/>`;
    else o += `<path d="M${X} ${Y} A${S} ${S} 0 0 1 ${X + S} ${Y + S} L${X} ${Y + S}Z" fill="${c}"/>`;
  });
  return o + '</svg>';
}
// Flat colour + waveform glyph (C)
function glyph(w, h, seed, bg, fg) {
  const r = rng(seed), n = 28; let o = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/>`;
  const bw = w / (n * 2);
  for (let i = 0; i < n; i++) { const env = Math.sin(Math.PI * (i + .5) / n), hh = h * (0.08 + env * (0.2 + r() * 0.45)); o += `<rect x="${(i * 2 + .5) * bw}" y="${h / 2 - hh / 2}" width="${bw}" height="${hh}" rx="${bw / 2}" fill="${fg}"/>`; }
  return o + '</svg>';
}
// Soft flat blobs (D)
function blob(size, seed, cols, bg) {
  const r = rng(seed); let o = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${bg ? `<rect width="${size}" height="${size}" fill="${bg}"/>` : ''}`;
  cols.forEach((c, i) => {
    const cx = size * (0.3 + r() * 0.4), cy = size * (0.3 + r() * 0.4), R = size * (0.18 + r() * 0.16); let d = '';
    for (let k = 0; k <= 8; k++) { const a = k / 8 * Math.PI * 2, rr = R * (0.85 + r() * 0.3); d += (k ? ' ' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1); }
    o += `<path d="${smooth(d)}" fill="${c}" opacity="${i ? .92 : 1}" style="mix-blend-mode:multiply"/>`;
  });
  return o + '</svg>';
}
function smooth(d) { // closed Catmull-Rom through points
  const p = d.replace('M', '').trim().split(' ').map(s => s.split(',').map(Number)); p.pop();
  const n = p.length; let s = `M${p[0][0]},${p[0][1]}`;
  for (let i = 0; i < n; i++) { const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n]; s += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`; }
  return s + 'Z';
}
// listening bars
function bars(w, h, seed, fg, hi, n = 40, shape = 'round') {
  const r = rng(seed); let o = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`; const bw = w / (n * 1.9);
  for (let i = 0; i < n; i++) { const env = Math.sin(Math.PI * (i + .5) / n), hh = Math.max(bw, h * env * (0.15 + r() * 0.85)); const x = i * w / n + (w / n - bw) / 2; o += `<rect x="${x}" y="${h / 2 - hh / 2}" width="${bw}" height="${hh}" rx="${shape === 'round' ? bw / 2 : 0}" fill="${Math.abs(i - n / 2) < n * 0.18 ? hi : fg}"/>`; }

function bauhausHero(s) {
  // stacked half-circles like a sound sign, flat colours
  const c = ['#1f3a5f', '#d9653b', '#e3b23c', '#8aa37b', '#161513'];
  let o = `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">`;
  o += `<circle cx="${s / 2}" cy="${s / 2}" r="${s / 2}" fill="${c[0]}"/>`;
  o += `<path d="M0 ${s / 2} A${s / 2} ${s / 2} 0 0 0 ${s} ${s / 2}Z" fill="${c[1]}"/>`;
  o += `<circle cx="${s / 2}" cy="${s / 2}" r="${s * .3}" fill="${c[2]}"/>`;
  o += `<path d="M${s * .2} ${s / 2} A${s * .3} ${s * .3} 0 0 0 ${s * .8} ${s / 2}Z" fill="${c[4]}"/>`;
  o += `<circle cx="${s / 2}" cy="${s / 2}" r="${s * .1}" fill="#f2eee5"/>`;
  for (let i = 0; i < 5; i++) o += `<rect x="${s * .36 + i * s * .06}" y="${s * .5 - s * (0.03 + 0.04 * Math.sin(i * 1.3 + 1) ** 2)}" width="${s * .025}" height="${s * (0.06 + 0.08 * Math.sin(i * 1.3 + 1) ** 2)}" fill="#f2eee5" rx="${s * .012}" transform="translate(0 ${s * .17})"/>`;
  return o + '</svg>';
}
